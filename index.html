<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.svg">
<script>
// 首屏渲染前设置 data-theme 与主题色，避免闪烁
(function () {
  try {
    var m = 'system';
    try { var raw = localStorage.getItem('zh:settings'); if (raw) m = JSON.parse(raw).theme || 'system'; } catch (e2) { }
    var dark = m === 'dark' || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', dark ? '#000000' : '#ffffff');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<title>记账</title>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="modal-root"></div>
<script>
(function () {
  var v = '';
  try { v = new URLSearchParams(location.search).get('_v') || ''; } catch (e) { } // 尝试获取新版本
  var q = v ? ('?_v=' + encodeURIComponent(v)) : ''; // 获取版本信息
  var link = document.querySelector('link[href^="css/style.css"]');
  if (link && q) link.setAttribute('href', 'css/style.css' + q);
  var files = [
    'js/version.js', 'js/util.js', 'js/store.js', 'js/templates.js', 'js/ledger.js',
    'js/category.js', 'js/charts.js', 'js/ai.js', 'js/chat.js', 'js/io.js',
    'js/views.js', 'js/app.js'
  ];
  for (var i = 0; i < files.length; i++) {
    var s = document.createElement('script');
    s.src = files[i] + q;
    s.async = false;
    document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
